name: Deploy to CloudBase

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        working-directory: apps/project-burger-shop-auth-users-2
        run: npm ci

      - name: Build static site
        working-directory: apps/project-burger-shop-auth-users-2
        run: npm run build

      - name: Install CloudBase CLI
        run: npm install -g @cloudbase/cli

      - name: Login and Deploy to CloudBase
        working-directory: apps/project-burger-shop-auth-users-2
        run: |
          tcb login --apiKeyId "${{ secrets.TENCENT_SECRET_ID }}" --apiKey "${{ secrets.TENCENT_SECRET_KEY }}"
          tcb hosting deploy ./out / -e "${{ secrets.TCB_ENV_ID }}"
