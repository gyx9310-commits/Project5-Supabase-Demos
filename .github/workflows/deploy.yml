name: Deploy to CloudBase

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      TENCENTCLOUD_SECRET_ID: ${{ secrets.TCB_SECRET_ID }}
      TENCENTCLOUD_SECRET_KEY: ${{ secrets.TCB_SECRET_KEY }}
      TCB_ENV_ID: ${{ secrets.TCB_ENV_ID }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        working-directory: apps/project-burger-shop-auth-users-2
        run: npm ci

      - name: Build static site
        working-directory: apps/project-burger-shop-auth-users-2
        run: npm run build

      - name: Install CloudBase CLI
        run: npm install -g @cloudbase/cli

      - name: Login CloudBase CLI (key mode)
        run: echo -e "${{ secrets.TCB_SECRET_ID }}\n${{ secrets.TCB_SECRET_KEY }}" | tcb login --key

      - name: Deploy to CloudBase Static Hosting
        working-directory: apps/project-burger-shop-auth-users-2
        run: tcb hosting deploy ./out / -e ${{ secrets.TCB_ENV_ID }}
